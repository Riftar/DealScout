# /etc/nginx/sites-available/dealscout
# The Dashboard is the only thing published. Nothing on disk is served: Snapshots, Run
# output and .env stay unreachable because nginx has no root here.

# Defining a Job and Run now cost model money and Portal requests, so writes are rate
# limited per address. Reads have an empty key and are not limited.
map $request_method $dealscout_writer {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $dealscout_writer zone=dealscout_write:1m rate=6r/m;

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 16k;

    location / {
        limit_req zone=dealscout_write burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
